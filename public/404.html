<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Not found · UX Dashboard</title>
    <!--
      Netlify serves this file for any address that does not exist, and the
      public build's generated `_redirects` (scripts/public-redirects.mjs)
      points the blocked static folders at it too — so a hidden prototype and a
      mistyped URL look identical, which is deliberate. Self-contained on
      purpose: no app CSS, no fonts, nothing that would fail if the SPA bundle
      were what was missing.
    -->
    <style>
      html { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #f5f5f5;
        color: #1b1d21;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1b1d21; color: #f1f3f7; }
        a { color: #9cc2e5; }
      }
      main { text-align: center; padding: 32px; max-width: 32rem; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 16px; opacity: 0.8; }
      a { color: #1f4e88; }
    </style>
  </head>
  <body>
    <main>
      <h1>There’s nothing at this address.</h1>
      <p>The page may have moved, or the link may be incomplete.</p>
      <a href="/">Back to the UX Dashboard</a>
    </main>
  </body>
</html>
