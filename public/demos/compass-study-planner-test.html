{pc.meterPct}}; background: #3D5A73; border-radius: 3px\">\u003c/div>\u003c/div>\n          \u003c/div>\n        \u003c/section>\n        \u003c/sc-if>\n\n        \u003csection aria-label=\"Your plan\" style=\"margin-top: 28px; display: flex; flex-direction: column; gap: 22px; padding: 24px 26px; border: 1px solid #DCDEE1; border-radius: 16px; background: #F4F5F7\">\n          \u003cdiv style=\"display: flex; align-items: center; gap: 20px 40px; flex-wrap: wrap\">\n            \u003cdiv style=\"flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px\">\n              \u003clabel for=\"goal-date\" style=\"font-size: 13px; color: #42464F\">Goal date (your exam)\u003c/label>\n              \u003cinput id=\"goal-date\" class=\"pl-date\" type=\"date\" value=\"{{examIso}}\" min=\"2026-09-23\" max=\"2027-03-31\" onChange=\"{{onExam}}\" style=\"align-self: flex-start; box-sizing: border-box; height: 42px; padding: 0 10px; border: 1px solid #C9D1D7; border-radius: 8px; background: #FFFFFF; font-family: 'Playfair Display', Georgia, serif; font-size: 20px; font-weight: 500; color: #1F1D18\">\n              \u003cspan style=\"font-size: 13px; color: #615C55\">{{daysAway}} days away\u003c/span>\n            \u003c/div>\n            \u003cdiv style=\"flex: 1 1 160px; display: flex; flex-direction: column; gap: 4px\">\n              \u003cspan style=\"font-size: 13px; color: #42464F\">Your pace\u003c/span>\n              \u003cspan style=\"font-family: 'Playfair Display', Georgia, serif; font-size: 22px; font-weight: 500\">{{paceName}}\u003c/span>\n              \u003cspan style=\"font-size: 13px; color: #615C55\">{{weekTotal}} a week\u003c/span>\n            \u003c/div>\n            \u003cdiv aria-live=\"polite\" style=\"flex: 1.3 1 220px; display: flex; flex-direction: column; gap: 4px\">\n              \u003cspan style=\"font-size: 13px; color: #42464F\">Course finishes\u003c/span>\n              \u003cspan style=\"font-family: 'Playfair Display', Georgia, serif; font-size: 28px; font-weight: 500; line-height: 1.1\">{{finishLabel}}\u003c/span>\n              \u003cspan style=\"font-size: 13px; font-weight: 600; color: {{finishColor}}\">{{finishNote}}\u003c/span>\n            \u003c/div>\n            \u003csc-if value=\"{{showChange}}\" hint-placeholder-val=\"{{true}}\">\u003cbutton type=\"button\" class=\"btn-outline\" onClick=\"{{openPace}}\" aria-expanded=\"false\" aria-controls=\"pace-editor\" style=\"flex: 0 0 auto; min-height: 40px; padding: 0 16px; border: 1px solid #2F4A63; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #2F4A63; cursor: pointer\">Change pace\u003c/button>\u003c/sc-if>\n            \u003csc-if value=\"{{showDone}}\" hint-placeholder-val=\"{{false}}\">\u003cbutton type=\"button\" class=\"btn-outline\" onClick=\"{{closePace}}\" aria-expanded=\"true\" aria-controls=\"pace-editor\" style=\"flex: 0 0 auto; min-height: 40px; padding: 0 16px; border: 1px solid #2F4A63; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #2F4A63; cursor: pointer\">Done\u003c/button>\u003c/sc-if>\n          \u003c/div>\n\n          \u003csc-if value=\"{{editing}}\" hint-placeholder-val=\"{{false}}\">\n            \u003cdiv id=\"pace-editor\" style=\"display: flex; flex-direction: column; gap: 18px; padding-top: 20px; border-top: 1px solid #DCDEE1\">\n              \u003cdiv role=\"radiogroup\" aria-label=\"Pick a pace\" style=\"display: flex; flex-direction: column; gap: 10px\">\n                \u003cspan style=\"font-size: 13px; font-weight: 600; color: #1F1D18\">Pick a pace\u003c/span>\n                \u003cdiv style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px\">\n                  \u003csc-for list=\"{{paces}}\" as=\"p\" hint-placeholder-count=\"3\">\n                    \u003cbutton type=\"button\" role=\"radio\" aria-checked=\"{{p.checked}}\" class=\"pace-card\" onClick=\"{{p.pick}}\" style=\"display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 16px 18px; border: {{p.border}}; border-radius: 12px; background: {{p.bg}}; font: inherit; text-align: left; cursor: pointer\" data-late=\"{{p.late}}\">\n                      \u003cspan style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #1F1D18\">{{p.name}}\u003csc-if value=\"{{p.suggested}}\" hint-placeholder-val=\"{{false}}\">\u003cspan style=\"display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; background: #EEF0F2; border: 1px solid #DCDEE1; font-size: 11px; font-weight: 600; color: #42464F\">Suggested\u003c/span>\u003c/sc-if>\u003c/span>\n                      \u003cspan style=\"font-family: 'Playfair Display', Georgia, serif; font-size: 24px; font-weight: 500; line-height: 1.2; color: #1F1D18\">{{p.total}} \u003cspan style=\"font-family: 'Open Sans', system-ui, sans-serif; font-size: 13px; color: #42464F\">a week\u003c/span>\u003c/span>\n                      \u003cspan style=\"font-size: 13px; color: #42464F\">{{p.perDay}} on study days\u003c/span>\n                      \u003cspan style=\"padding-top: 6px; font-size: 13px; font-weight: 600; color: {{p.finishColor}}\">{{p.finish}}\u003c/span>\n                    \u003c/button>\n                  \u003c/sc-for>\n                \u003c/div>\n              \u003c/div>\n\n              \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px\">\n                \u003cdiv style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap\">\n                  \u003cspan style=\"font-size: 13px; color: #42464F\">\u003cb style=\"font-weight: 600; color: #1F1D18\">Spread it across your week\u003c/b> · weekends can be different from weekdays\u003c/span>\n                  \u003cspan style=\"font-size: 13px; font-weight: 600; color: #1F1D18\">{{weekTotal}} a week\u003c/span>\n                \u003c/div>\n                \u003csc-for list=\"{{sliders}}\" as=\"s\" hint-placeholder-count=\"7\">\n                  \u003cdiv style=\"display: flex; align-items: center; gap: 16px; min-height: 36px\">\n                    \u003clabel for=\"{{s.id}}\" style=\"flex: 0 0 40px; font-size: 13px; color: #42464F\">{{s.label}}\u003c/label>\n                    \u003cinput id=\"{{s.id}}\" class=\"pl-range\" type=\"range\" min=\"0\" max=\"180\" step=\"15\" value=\"{{s.value}}\" onChange=\"{{s.change}}\" aria-valuetext=\"{{s.text}}\" style=\"flex: 1 1 auto; min-width: 0\">\n                    \u003cspan style=\"flex: 0 0 64px; text-align: right; font-size: 13px; color: #1F1D18\">{{s.text}}\u003c/span>\n                  \u003c/div>\n                \u003c/sc-for>\n              \u003c/div>\n\n              \u003csc-if value=\"{{lowNote}}\" hint-placeholder-val=\"{{false}}\">\n                \u003cdiv style=\"display: flex; gap: 10px; padding: 12px 14px; border-left: 3px solid #2F4A63; background: #FFFFFF; border-radius: 0 8px 8px 0; font-size: 13px; line-height: 1.5; color: #42464F\">\u003cspan>\u003cb style=\"font-weight: 600; color: #2F4A63\">Good to know:\u003c/b> most people taking Life and Health study about 7 hours a week. You’re at {{weekTotal}}.\u003c/span>\u003c/div>\n              \u003c/sc-if>\n\n              \u003csc-if value=\"{{dirty}}\" hint-placeholder-val=\"{{false}}\">\n                \u003cdiv role=\"status\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 14px 12px 16px; border: 1px solid #DCDEE1; border-radius: 10px; background: #FFFFFF\">\n                  \u003cspan style=\"font-size: 13px; color: #42464F\">You’ve changed your pace.\u003c/span>\n                  \u003cspan style=\"display: flex; gap: 10px\">\n                    \u003cbutton type=\"button\" class=\"btn-fill\" onClick=\"{{savePace}}\" style=\"min-height: 36px; padding: 0 16px; border: 0; border-radius: 8px; background: #2F4A63; font: inherit; font-size: 13px; font-weight: 600; color: #FFFFFF; cursor: pointer\">Save plan\u003c/button>\n                    \u003cbutton type=\"button\" class=\"btn-outline\" onClick=\"{{undoPace}}\" style=\"min-height: 36px; padding: 0 16px; border: 1px solid #C9D1D7; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #1F1D18; cursor: pointer\">Undo changes\u003c/button>\n                  \u003c/span>\n                \u003c/div>\n              \u003c/sc-if>\n            \u003c/div>\n          \u003c/sc-if>\n        \u003c/section>\n\n        \u003csection aria-labelledby=\"cal-h\" style=\"margin-top: 36px; display: flex; flex-direction: column; gap: 10px\">\n          \u003cdiv style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n            \u003cdiv style=\"display: flex; align-items: center; gap: 14px\">\n              \u003ch2 id=\"cal-h\" style=\"margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 24px; font-weight: 500\">{{calTitle}}\u003c/h2>\n              \u003csc-if value=\"{{isWeek}}\" hint-placeholder-val=\"{{true}}\">\n                \u003cspan style=\"display: inline-flex; gap: 6px\">\n                  \u003cbutton type=\"button\" class=\"btn-outline\" onClick=\"{{prevWeek}}\" disabled=\"{{prevDisabled}}\" aria-label=\"Previous week\" style=\"width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1px solid #DCDEE1; border-radius: 8px; background: #FFFFFF; color: #1F1D18; cursor: pointer; opacity: {{prevOpacity}}\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M15 18l-6-6 6-6\">\u003c/path>\u003c/svg>\u003c/button>\n                  \u003cbutton type=\"button\" class=\"btn-outline\" onClick=\"{{nextWeek}}\" disabled=\"{{nextDisabled}}\" aria-label=\"Next week\" style=\"width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1px solid #DCDEE1; border-radius: 8px; background: #FFFFFF; color: #1F1D18; cursor: pointer; opacity: {{nextOpacity}}\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M9 18l6-6-6-6\">\u003c/path>\u003c/svg>\u003c/button>\n                \u003c/span>\n              \u003c/sc-if>\n            \u003c/div>\n            \u003cdiv role=\"group\" aria-label=\"Calendar view\" style=\"display: inline-flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid #DCDEE1; border-radius: 10px; background: #FFFFFF\">\n              \u003csc-for list=\"{{views}}\" as=\"v\" hint-placeholder-count=\"2\">\n                \u003cbutton type=\"button\" class=\"seg\" onClick=\"{{v.pick}}\" aria-pressed=\"{{v.pressed}}\" style=\"display: inline-flex; align-items: center; min-height: 32px; padding: 0 14px; border: 0; border-radius: 7px; background: {{v.bg}}; color: {{v.color}}; font: inherit; font-size: 13px; font-weight: {{v.weight}}; cursor: pointer\">{{v.label}}\u003c/button>\n              \u003c/sc-for>\n            \u003c/div>\n          \u003c/div>\n          \u003cp style=\"margin: 0; font-size: 13px; color: #42464F\">Can’t study on a day? Point at it and choose Skip, or \u003cbutton type=\"button\" onClick=\"{{startPick}}\" style=\"padding: 0; border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600; color: #2F4A63; text-decoration: underline; text-underline-offset: 3px; cursor: pointer\">pick several days\u003c/button>.\u003c/p>\n\n          \u003csc-if value=\"{{hasToast}}\" hint-placeholder-val=\"{{false}}\">\n            \u003cdiv role=\"status\" style=\"display: flex; align-items: center; gap: 12px; flex-wra {m.current}}\" style=\"display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 10px; background: {{m.bg}}; color: {{m.color}}; font-size: 15px; font-weight: {{m.weight}}; text-decoration: none\">\u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"{{m.icon}}\">\u003c/path>\u003c/svg>{{m.label}}\u003c/a>\n      \u003c/sc-for>\n    \u003c/div>\n  \u003c/sc-if>\n  \u003cnav class=\"bottom-bar\" aria-label=\"Main sections\">\n    \u003csc-for list=\"{{bbItems}}\" as=\"b\" hint-placeholder-count=\"4\">\n      \u003ca href=\"{{b.href}}\" class=\"bb-item\" aria-current=\"{{b.current}}\" style=\"flex: 1 1 0; min-width: 0; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; box-sizing: border-box; border-top: 3px solid {{b.rule}}; color: {{b.color}}; font-size: 12px; font-weight: {{b.weight}}; text-decoration: none\">\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"{{b.icon}}\">\u003c/path>\u003c/svg>{{b.label}}\u003c/a>\n    \u003c/sc-for>\n    \u003cbutton type=\"button\" class=\"bb-item\" onClick=\"{{toggleMore}}\" aria-expanded=\"{{moreExp}}\" aria-haspopup=\"dialog\" style=\"flex: 1 1 0; min-width: 0; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; box-sizing: border-box; border: 0; border-top: 3px solid {{moreRule}}; background: transparent; color: {{moreColor}}; font: inherit; font-size: 12px; font-weight: {{moreWeight}}; cursor: pointer\">\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 12h.01M12 12h.01M19 12h.01\">\u003c/path>\u003c/svg>More\u003c/button>\n  \u003c/nav>\n\u003c/div>\n\u003c/x-dc>\n\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"uiFont\":{\"editor\":\"enum\",\"options\":[\"Open Sans\",\"Inter\"],\"default\":\"Open Sans\",\"section\":\"Type\"},\"$preview\":{\"width\":1440,\"height\":2300}}'>\nclass Component extends DCLogic {\n  // ---------- Rubi message mode: Current vs New (LX Inter-Session Dashboard Nudges, 11-2-26) ----------\n  msgNew() {\n    const st = this.state || {};\n    let v = st.msg;\n    if (!v) { try { v = window.localStorage.getItem('compass-msg-v1'); } catch (e) {} }\n    return v === 'new';\n  }\n  setMsg(v) {\n    try { window.localStorage.setItem('compass-msg-v1', v); } catch (e) {}\n    this.setState({ msg: v, nudgeOff: false, nudgePause: null, nchips: null, pcStep: null });\n  }\n  mx(a, b) { return this.msgNew() ? b : a; }\n  tocClassicOn() {\n    const st = this.state || {};\n    let v = st.tocStyle;\n    if (!v) { try { v = window.localStorage.getItem('compass-toc-v1'); } catch (e) {} }\n    return v === 'classic';\n  }\n  setTocStyle(v) {\n    try { window.localStorage.setItem('compass-toc-v1', v); } catch (e) {}\n    this.setState({ tocStyle: v });\n  }\n  msgBarVals() {\n    const isNew = this.msgNew();\n    const seg = (on) => 'font-family: inherit; font-size: 13px; font-weight: 600; min-height: 30px; padding: 0 12px; border-radius: 7px; border: 0; cursor: pointer; background: ' + (on ? '#F3EFE6' : 'transparent') + '; color: ' + (on ? '#1F1D18' : '#F3EFE6');\n    return {\n      msgNew: isNew, msgCur: !isNew,\n      msgCurPressed: isNew ? 'false' : 'true', msgNewPressed: isNew ? 'true' : 'false',\n      msgCurStyle: seg(!isNew), msgNewStyle: seg(isNew),\n      msgPickCur: () => this.setMsg('cur'), msgPickNew: () => this.setMsg('new'),\n      tocNewPressed: this.tocClassicOn() ? 'false' : 'true', tocClassicPressed: this.tocClassicOn() ? 'true' : 'false',\n      tocNewStyle: seg(!this.tocClassicOn()), tocClassicStyle: seg(this.tocClassicOn()),\n      tocPickNew: () => this.setTocStyle('new'), tocPickClassic: () => this.setTocStyle('classic'),\n      fcDesc: isNew ? 'Rubi builds decks from topics you choose and cards you mark.' : 'Rubi builds decks from weak topics and cards you mark.'\n    };\n  }\n  // ---- Facts the platform holds, worded per Nudge 09 (facts, not verdicts)\n  nudgeFacts() {\n    const P = this.stageP();\n    const days = { p2: 14, p3: 3, u4: 21, u5: 9 }[P.id] || null;\n    const BANK = [60, 60, 55, 45, 45];\n    const rows = P.topics.map((name, i) => ({ name, i, acc: P.sc ? P.sc[i] : null, n: P.n[i], w: P.W[i], bank: BANK[i] }));\n    const scored = rows.filter((r) => r.acc != null && r.n > 0);\n    const untouched = rows.filter((r) => r.n === 0);\n    let top = null, low = null;\n    if (scored.length) { top = scored.reduce((a, b) => (b.acc > a.acc ? b : a)); low = scored.reduce((a, b) => (b.acc \u003c a.acc ? b : a)); }\n    const stands = !!(top && low && top.acc - low.acc >= 5);\n    const list = (a) => (a.length \u003c= 1 ? a.join('') : a.slice(0, -1).join(', ') + ' or ' + a[a.length - 1]);\n    const praise = { u2: 'Nice work finishing the Life Insurance lessons.', q8: 'Great job earning your certificate.' }[P.id] || '';\n    const daysLine = days ? 'You have ' + days + ' days until your exam.' : '';\n    let lead;\n    if (stands) lead = 'Nice work in ' + top.name + ': ' + top.acc + '% accuracy on ' + top.n + ' questions. Your accuracy is lowest in ' + low.name + ': ' + low.acc + '% on ' + low.n + ' questions.';\n    else if (P.answered > 0) lead = 'You’ve answered ' + P.answered + ' practice questions so far.';\n    else lead = 'You haven’t answered any practice questions yet. A few questions in each topic will give you a first picture.';\n    const gap = untouched.length && untouched.length \u003c 5 ? 'You haven’t practiced ' + list(untouched.map((r) => r.name)) + ' yet. A few questions there will give you a fuller picture.' : '';\n    const extra = P.id === 'u3' ? 'You also have 3 Annuities lessons left in the course.' : '';\n    const growth = P.answered > 0 ? 'Your skills can grow with focused practice. Let’s build on what you already know.' : '';\n    const ask = 'How would you like to use today’s session?';\n    const text = [praise, daysLine, lead, gap, extra, growth, ask].filter(Boolean).join(' ');\n    const focus = stands ? low : (untouched[0] || low || rows[0]);\n    const strong = top || rows.filter((r) => r.n > 0)[0] || rows[0];\n    const title = P.answered > 0 ? 'Your practice so far' : 'Start your practice';\n    return { P, days, rows, top, low, stands, untouched, focus, strong, text, title, lead, daysLine };\n  }\n  // ---- Response options: act, give context, or decline\n  nudgeChoice(label, o) {\n    const tone = o.tone || 'ghost';\n    const accent = o.accent || '#2F4A63';\n    const base = 'display: inline-flex; align-items: center; justify-content: center; min-height: 36px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap; ';\n    const style = base + (tone === 'fill' ? 'border: 0; background: ' + accent + '; color: #FFFFFF' : tone === 'line' ? 'border: 1px solid #C7D5E2; background: #FFFFFF; color: #2F4A63' : 'border: 0; background: transparent; color: #2F4A63; text-decoration: underline; padding: 0 6px');\n    const ask = (q) => () => { const w = this.wsVals ? this.wsVals() : null; if (w && w.wsAsk) w.wsAsk(q); else this.setState({ status: 'Rubi would open with: ' + q }); };\n    const act = o.href ? () => {} : o.act ? o.act : o.ask ? ask(o.ask) : () => {};\n    return { label, isLink: !!o.href, isBtn: !o.href, href: o.href || '#', act, style };\n  }\n  nudgeSet(kind, accent) {\n    const c = (l, o) => this.nudgeChoice(l, Object.assign({ accent }, o));\n    const off = () => this.setState({ nudgeOff: true });\n    const S = {\n      '09': [c('Let’s make a plan', { tone: 'fill', ask: 'Let’s make a plan' }), c('Let’s talk it through', { tone: 'line', ask: 'Let’s talk it through' }), c('See my snapshot', { tone: 'line', href: 'Readiness.dc.html' }), c('Not now', { act: off })],\n      '09r': [c('Let’s make a plan', { tone: 'fill', ask: 'Let’s make a plan' }), c('Let’s talk it through', { tone: 'line', ask: 'Let’s talk it through' }), c('See topic details', { tone: 'line', href: '#bytopic-h' }), c('Not now', { act: off })],\n      '08': [c('Check my plan', { tone: 'fill', href: 'StudyPlanner.dc.html' }), c('Review first', { tone: 'line', ask: 'Review first' }), c('Talk with Rubi', { tone: 'line', ask: 'Talk with Rubi' }), c('Just start', { tone: 'line', href: 'Course.dc.html' }), c('Not now', { act: off })],\n      '05': [c('Pick up where I left off', { tone: 'fill', href: 'Course.dc.html' }), c('Share what’s going on', { tone: 'line', ask: 'Share what’s going on' }), c('Not now', { act: off })],\n      intro: [c('Talk with Rubi', { tone: 'fill', ask: 'Talk with Rubi' }), c('Not now', { act: off })]\n    };\n    return S[kind] || S['09'];\n  }\n  // ---- One card model for every Rubi suggestion; handles Not now and pausing offers\n  nudgeCard(base, accent) {\n    const st = this.state || {};\n    const c = (l, o) => this.nudgeChoice(l, Object.assign({ accent }, o));\n    if (st.nudgePause) {\n      const p = st.nudgePause;\n      return Object.assign({}, base, { title: 'Rubi’s offers are paused', why: 'They come back on ' + (p === 'session' ? 'at the start of your next session' : 'in ' + p) + '. Learning continues as normal, and you can still ask Rubi anything.', choices: [c('Turn offers back on', { tone: 'line', act: () => this.setState({ nudgePause: null, nudgeOff: false }) })] });\n    }\n    if (st.nudgeOff) {\n      const pause = (p) => () => this.setState({ nudgePause: p });\n      return Object.assign({}, base, { title: 'Okay, not now', why: 'Learning continues as normal. Would you like to pause Rubi’s offers for a while?', choices: [c('Pause 15 minutes', { tone: 'line', act: pause('15 minutes') }), c('Pause 30 minutes', { tone: 'line', act: pause('30 minutes') }), c('Until this session ends', { tone: 'line', act: pause('session') }), c('Show it again', { act: () => this.setState({ nudgeOff: false }) })] });\n    }\n    return base;\n  }\n  // ---- Session-start and planning-screen messages for the Overview\n  nudgeOverview() {\n    const P = this.stageP();\n    const F = this.nudgeFacts();\n    const R = '#B4552F';\n    const c = (l, o) => this.nudgeChoice(l, Object.assign({ accent: R }, o));\n    const off = () => this.setState({ nudgeOff: true });\n    const M = {\n      q1: { label: 'Rubi · learning support', title: 'Hi, I’m Rubi', why: 'I can explain a term, give an example or recap a lesson whenever you ask. At the start of a session, I’ll check in with a short welcome. You can pause my offers any time.', choices: this.nudgeSet('intro', R) },\n      q2: { label: 'Rubi · welcome back', title: 'Welcome back', why: 'Nice work finishing Lesson 7. Shall we review what we did yesterday before diving into today’s plan?', choices: this.nudgeSet('08', R) },\n      q3: { label: 'Rubi · welcome back', title: 'Welcome back', why: 'Nice work finishing Policy Provisions. 3 days ago, you finished 2 sections and answered 12 lesson questions in Compass, covering riders and policy loans. Would you like to review that first, or plan today’s session?', choices: this.nudgeSet('08', R) },\n      q4: { label: 'Rubi · progress check-in', title: 'Welcome back', why: 'You’ve already made progress in this course, and coming back matters. What would help most today?', choices: this.nudgeSet('05', R) },\n      q5: { label: 'Rubi · welcome back', title: 'Nice work finishing all 36 lessons', why: 'Your next step is the course affidavit. Florida asks you to confirm you did the course yourself, and signing it opens the final course exam. Are you ready to keep going?', choices: [c('Sign the affidavit', { tone: 'fill', href: 'Learn.dc.html' }), c('Ask about the affidavit', { tone: 'line', ask: 'Why does the affidavit matter?' }), c('Not now', { act: off })] },\n      q6: { label: 'Rubi · welcome back', title: 'Nice work signing your affidavit', why: 'The final course exam is open. Would you like a short recap of a topic first? Recaps are optional and never block the exam.', choices: [c('Start the exam', { tone: 'fill', href: 'Learn.dc.html' }), c('Recap a topic', { tone: 'line', ask: 'Recap a topic' }), c('Not now', { act: off })] },\n      q7: { label: 'Rubi · welcome back', title: 'Great job passing the final course exam!', why: 'One step is left: the course survey. Your certificate issues when you submit it, and Exam Prep opens right after.', choices: [c('Start the survey', { tone: 'fill', href: 'Learn.dc.html' }), c('What happens next?', { tone: 'line', ask: 'What happens after the survey?' }), c('Not now', { act: off })] },\n      q8: { label: 'Rubi · learning support', title: 'Exam Prep is open', why: 'Great job earning your certificate. Practice questions are built like the state exam, so they can feel harder than lesson checks. You haven’t practiced any topics yet. How would you like to start?', choices: [c('Start practice', { tone: 'fill', accent: '#2F4A63', href: 'PracticeSession.dc.html' }), c('Let’s make a plan', { tone: 'line', ask: 'Let’s make a plan' }), c('Not now', { act: off })] },\n      u1: { label: 'Rubi · study check-in', title: 'Start your practice', why: 'You haven’t started a lesson or practice yet. Lessons and practice open in any order. How would you like to use today’s session?', choices: [c('Let’s make a plan', { tone: 'fill', accent: '#2F4A63', ask: 'Let’s make a plan' }), c('Start a lesson', { tone: 'line', href: 'Course.dc.html' }), c('Not now', { act: off })] }\n    };\n    const base = M[P.id] || { label: 'Rubi · study check-in', title: F.title, why: F.text, choices: this.nudgeSet('09', '#2F4A63') };\n    return this.nudgeCard(base, P.qe ? R : '#2F4A63');\n  }\n  // ---- Planning-conversation replies (advice belongs here, after the learner asks)\n  nudgePlanReply() {\n    const P = this.stageP();\n    const F = this.nudgeFacts();\n    if (P.qe) return P.wrapping ? 'Here’s one way to use it: start with your next required step, then a short recap of any topic you choose. Does that work for you? How else might you approach this?' : 'Here’s one way to use it: pick up the lesson where you left off, then a short recap of the section before it. Does that work for you? How else might you approach this?';\n    if (F.stands) {\n      const second = F.rows.filter((r) => r.acc != null && r.n > 0 && r.i !== F.low.i).sort((a, b) => (a.acc - b.acc) || (b.w - a.w))[0];\n      return 'Here’s one way to order your practice, based on each topic’s weight on the exam and your accuracy so far: start with ' + F.low.name + ' (' + F.low.w + '% of the exam, ' + F.low.acc + '% on ' + F.low.n + ' questions), then ' + (second ? second.name + ' (' + second.w + '% of the exam).' : 'a short mixed set.') + ' Does this resonate with you? How else might you approach this?';\n    }\n    if (F.untouched.length && F.untouched.length \u003c 5) return 'Here’s one way to start: a mixed set across ' + F.untouched.map((r) => r.name).join(' and ') + ', since you haven’t practiced them yet. Then we can look at your results together. Does this resonate with you?';\n    if (P.answered === 0) return 'Here’s one way to start: a short mixed set across all five topics. It gives you a first picture of where you are. Does that work for you?';\n    return 'Here’s one way to use it: a short mixed set across all five topics, then review any questions you missed. Does this resonate with you? How else might you approach this?';\n  }\n  nudgeR() {\n    if (!this.msgNew()) return {};\n    const P = this.stageP();\n    const F = this.nudgeFacts();\n    const exam = { p2: 'Aug 14', p3:
